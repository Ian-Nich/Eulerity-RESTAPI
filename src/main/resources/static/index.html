<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Task Manager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #1a1a1a;
      color: #e8e8e8;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container { max-width: 860px; margin: 0 auto; }

    header {
      margin-bottom: 40px;
      border-bottom: 1px solid #333;
      padding-bottom: 20px;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: #fff;
    }

    header p { color: #888; font-size: 0.9rem; margin-top: 4px; }

    .card {
      background: #242424;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .card h2 {
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: 0.75rem;
      color: #aaa;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 4px;
      margin-top: 12px;
    }

    label:first-of-type { margin-top: 0; }

    input, select, textarea {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      color: #e8e8e8;
      padding: 8px 12px;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #666;
    }

    textarea { resize: vertical; min-height: 64px; }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }

    button {
      margin-top: 16px;
      padding: 9px 20px;
      background: #fff;
      color: #1a1a1a;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover { background: #ddd; }

    button.secondary {
      background: transparent;
      color: #aaa;
      border: 1px solid #3a3a3a;
    }

    button.secondary:hover { background: #2a2a2a; color: #fff; }

    .msg { font-size: 0.82rem; margin-top: 10px; min-height: 18px; }
    .msg.error { color: #f87171; }
    .msg.success { color: #86efac; }

    /* Task table */
    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    thead tr { border-bottom: 1px solid #333; }

    th {
      text-align: left;
      padding: 8px 12px;
      color: #777;
      font-weight: 500;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    td { padding: 10px 12px; border-bottom: 1px solid #2a2a2a; color: #ccc; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #2a2a2a; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .badge-LOW    { background: #1e3a2f; color: #86efac; }
    .badge-MEDIUM { background: #2d2a1e; color: #fde68a; }
    .badge-HIGH   { background: #3a1e1e; color: #fca5a5; }
    .badge-TODO      { background: #1e2a3a; color: #93c5fd; }
    .badge-IN_PROGRESS { background: #2a1e3a; color: #d8b4fe; }
    .badge-DONE      { background: #1e3a2f; color: #86efac; }

    .empty { color: #555; font-size: 0.85rem; padding: 20px 0; text-align: center; }

    /* AI result */
    .ai-result {
      display: none;
      margin-top: 16px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 16px;
    }

    .ai-result.visible { display: block; }

    .ai-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .ai-field label { color: #666; font-size: 0.72rem; margin-bottom: 2px; }
    .ai-field span  { color: #e8e8e8; font-size: 0.9rem; font-weight: 500; }

    .ai-explanation {
      font-size: 0.83rem;
      color: #999;
      border-top: 1px solid #2a2a2a;
      padding-top: 10px;
      line-height: 1.5;
    }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #444;
      border-top-color: #aaa;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="container">

  <header>
    <h1>Task Manager</h1>
    <p>Create and manage tasks. Use the AI suggestion tool to get priority and scheduling recommendations.</p>
  </header>

  <!-- TASK LIST -->
  <div class="card">
    <h2>All Tasks</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th><th>Title</th><th>Priority</th><th>Status</th><th>Due Date</th>
          </tr>
        </thead>
        <tbody id="task-body">
          <tr><td colspan="5" class="empty">Loading...</td></tr>
        </tbody>
      </table>
    </div>
    <button class="secondary" onclick="loadTasks()" style="margin-top:14px">↻ Refresh</button>
  </div>

  <!-- CREATE TASK -->
  <div class="card">
    <h2>Create Task</h2>
    <label>Title *</label>
    <input id="c-title" type="text" placeholder="What needs to be done?" />
    <label>Description</label>
    <textarea id="c-desc" placeholder="Optional details..."></textarea>
    <div class="form-row">
      <div>
        <label>Due Date</label>
        <input id="c-due" type="date" />
      </div>
      <div>
        <label>Priority</label>
        <select id="c-priority">
          <option>LOW</option>
          <option selected>MEDIUM</option>
          <option>HIGH</option>
        </select>
      </div>
      <div>
        <label>Status</label>
        <select id="c-status">
          <option selected>TODO</option>
          <option>IN_PROGRESS</option>
          <option>DONE</option>
        </select>
      </div>
    </div>
    <button onclick="createTask()">+ Create Task</button>
    <div class="msg" id="create-msg"></div>
  </div>

  <!-- AI SUGGEST -->
  <div class="card">
    <h2>AI Task Suggestion</h2>
    <label>Title *</label>
    <input id="s-title" type="text" placeholder="e.g. Submit quarterly report" />
    <label>Description</label>
    <textarea id="s-desc" placeholder="Optional context to improve suggestions..."></textarea>
    <button onclick="suggestTask()" id="suggest-btn">✦ Get AI Suggestion</button>

    <div class="ai-result" id="ai-result">
      <div class="ai-grid">
        <div class="ai-field">
          <label>PRIORITY</label>
          <span id="ai-priority">—</span>
        </div>
        <div class="ai-field">
          <label>DUE DATE</label>
          <span id="ai-due">—</span>
        </div>
        <div class="ai-field">
          <label>STATUS</label>
          <span id="ai-status">—</span>
        </div>
      </div>
      <div class="ai-explanation" id="ai-explanation"></div>
    </div>
  </div>

</div>

<script>
  const BASE = '/tasks';

  async function loadTasks() {
    const tbody = document.getElementById('task-body');
    try {
      const res = await fetch(BASE);
      const tasks = await res.json();
      if (tasks.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty">No tasks yet.</td></tr>';
        return;
      }
      tbody.innerHTML = tasks.map(t => `
        <tr>
          <td>${t.id}</td>
          <td>${t.title}</td>
          <td><span class="badge badge-${t.priority}">${t.priority}</span></td>
          <td><span class="badge badge-${t.status}">${t.status.replace('_', ' ')}</span></td>
          <td>${t.dueDate ?? '—'}</td>
        </tr>`).join('');
    } catch {
      tbody.innerHTML = '<tr><td colspan="5" class="empty">Failed to load tasks.</td></tr>';
    }
  }

  async function createTask() {
    const title = document.getElementById('c-title').value.trim();
    const msg = document.getElementById('create-msg');
    if (!title) {
      msg.textContent = 'Title is required.';
      msg.className = 'msg error';
      return;
    }

    const body = {
      title,
      description: document.getElementById('c-desc').value || null,
      dueDate: document.getElementById('c-due').value || null,
      priority: document.getElementById('c-priority').value,
      status: document.getElementById('c-status').value
    };

    const res = await fetch(BASE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    if (res.ok) {
      msg.textContent = 'Task created successfully.';
      msg.className = 'msg success';
      document.getElementById('c-title').value = '';
      document.getElementById('c-desc').value = '';
      document.getElementById('c-due').value = '';
      loadTasks();
    } else {
      const err = await res.json();
      msg.textContent = 'Error: ' + (err.detail ?? 'unknown error');
      msg.className = 'msg error';
    }
  }

  async function suggestTask() {
    const title = document.getElementById('s-title').value.trim();
    const btn = document.getElementById('suggest-btn');
    const result = document.getElementById('ai-result');

    if (!title) {
      result.classList.remove('visible');
      return;
    }

    btn.innerHTML = '<span class="spinner"></span>Thinking...';
    btn.disabled = true;
    result.classList.remove('visible');

    try {
      const res = await fetch(BASE + '/suggest', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title,
          description: document.getElementById('s-desc').value || null
        })
      });

      const data = await res.json();
      document.getElementById('ai-priority').innerHTML =
        `<span class="badge badge-${data.suggestedPriority}">${data.suggestedPriority}</span>`;
      document.getElementById('ai-due').textContent = data.suggestedDueDate ?? '—';
      document.getElementById('ai-status').innerHTML =
        `<span class="badge badge-${data.suggestedStatus}">${data.suggestedStatus?.replace('_',' ')}</span>`;
      document.getElementById('ai-explanation').textContent = data.explanation ?? '';
      result.classList.add('visible');
    } catch {
      result.classList.remove('visible');
    } finally {
      btn.innerHTML = '✦ Get AI Suggestion';
      btn.disabled = false;
    }
  }

  loadTasks();
</script>
</body>
</html>
